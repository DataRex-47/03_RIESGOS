<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1400" viewBox="0 0 1960 1400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1960" height="1400" fill="#fff"/>
<rect x="100" y="60" width="1760" height="100" rx="26" fill="#1C4F42"/>
<text x="980" y="128" font-size="58" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Quién es quién dentro de la API</text>
<rect x="100" y="210" width="550" height="390" rx="22" fill="#E4EFE8" stroke="#1C4F42" stroke-width="4"/>

<rect x="100" y="210" width="550" height="125" rx="22" fill="#1C4F42"/>
<rect x="100" y="290" width="550" height="45" rx="0" fill="#1C4F42"/>
<text x="375" y="262" font-size="44" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">schemas.py</text>
<text x="375" y="312" font-size="28" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">El contrato</text>
<text x="375" y="400" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Define qué campos entran y salen</text>
<text x="375" y="445" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">y qué valores acepta cada uno.</text>
<text x="375" y="490" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Si algo no cumple, la API</text>
<text x="375" y="535" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">responde error 422.</text>
<text x="375" y="580" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Ya no acepta tipo_interes.</text>
<rect x="705" y="210" width="550" height="390" rx="22" fill="#E4EFE8" stroke="#1C4F42" stroke-width="4"/>

<rect x="705" y="210" width="550" height="125" rx="22" fill="#1C4F42"/>
<rect x="705" y="290" width="550" height="45" rx="0" fill="#1C4F42"/>
<text x="980" y="262" font-size="44" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">scoring.py</text>
<text x="980" y="312" font-size="28" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">El motor</text>
<text x="980" y="400" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Carga los 3 modelos al arrancar</text>
<text x="980" y="445" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">y calcula PD, EAD, LGD, la pérdida</text>
<text x="980" y="490" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">esperada y la tasa sugerida.</text>
<text x="980" y="535" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Recibe una tabla: id y 12 variables.</text>
<rect x="1310" y="210" width="550" height="390" rx="22" fill="#E4EFE8" stroke="#1C4F42" stroke-width="4"/>

<rect x="1310" y="210" width="550" height="125" rx="22" fill="#1C4F42"/>
<rect x="1310" y="290" width="550" height="45" rx="0" fill="#1C4F42"/>
<text x="1585" y="262" font-size="44" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">main.py</text>
<text x="1585" y="312" font-size="28" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">El coordinador</text>
<text x="1585" y="400" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Recibe el POST, busca el historial,</text>
<text x="1585" y="445" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">une los datos, llama al motor y</text>
<text x="1585" y="490" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">responde. También sirve los ids</text>
<text x="1585" y="535" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">y la ficha del cliente y /health.</text>
<text x="980" y="690" font-size="36" fill="#1C4F42" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">De dónde sale cada dato que entra a los modelos (12 variables)</text>
<rect x="100" y="740" width="550" height="520" rx="22" fill="#fff" stroke="#1C4F42" stroke-width="4"/>
<rect x="100" y="740" width="550" height="110" rx="22" fill="#1C4F42"/>
<rect x="100" y="800" width="550" height="50" rx="0" fill="#1C4F42"/>
<text x="375" y="790" font-size="32" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">La pone el gestor en la app</text>
<text x="375" y="832" font-size="24" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">id_cliente y 4 variables</text>
<text x="375" y="905" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">id_cliente (solo identifica)</text>
<text x="375" y="943" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">principal (500 a 40.000)</text>
<text x="375" y="981" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">num_cuotas (36 o 60)</text>
<text x="375" y="1019" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">finalidad</text>
<text x="375" y="1057" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">vivienda</text>
<rect x="705" y="740" width="550" height="520" rx="22" fill="#fff" stroke="#2E7D5B" stroke-width="4"/>
<rect x="705" y="740" width="550" height="110" rx="22" fill="#2E7D5B"/>
<rect x="705" y="800" width="550" height="50" rx="0" fill="#2E7D5B"/>
<text x="980" y="790" font-size="32" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Sale del historial del cliente</text>
<text x="980" y="832" font-size="24" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">8 variables, desde el CSV</text>
<text x="980" y="905" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">ingresos</text>
<text x="980" y="943" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">ingresos_verificados</text>
<text x="980" y="981" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">rating</text>
<text x="980" y="1019" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">dti</text>
<text x="980" y="1057" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">antigüedad_empleo</text>
<text x="980" y="1095" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">num_lineas_credito</text>
<text x="980" y="1133" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">porc_uso_revolving</text>
<text x="980" y="1171" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">num_derogatorios</text>
<rect x="1310" y="740" width="550" height="520" rx="22" fill="#fff" stroke="#5E9C7E" stroke-width="4"/>
<rect x="1310" y="740" width="550" height="110" rx="22" fill="#5E9C7E"/>
<rect x="1310" y="800" width="550" height="50" rx="0" fill="#5E9C7E"/>
<text x="1585" y="790" font-size="32" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Ya no entra a los modelos</text>
<text x="1585" y="832" font-size="24" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">la tasa es una respuesta</text>
<text x="1585" y="905" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">tipo_interes</text>
<text x="1585" y="943" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">imp_cuota</text>
<text x="1585" y="981" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"></text>
<text x="1585" y="1019" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">La tasa la fija el banco según el riesgo:</text>
<text x="1585" y="1057" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">usarla para predecir el riesgo</text>
<text x="1585" y="1095" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">era circular (sale como tasa_sugerida)</text>
<text x="980" y="1325" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">Contrato de la API: entra id_cliente y 4 datos; sale id_cliente, pd_score, ead_score, lgd_score,</text>
<text x="980" y="1362" font-size="26" fill="#1B2733" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">perdida_esperada y tasa_sugerida.</text>
</svg>